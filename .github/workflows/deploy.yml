name: Deploy site

# Instant deploy of the current repo content (data.js as committed) to GitHub Pages,
# without re-running any sims. Use it to publish between the weekly full re-sims.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust asset versions
        run: |
          python - <<'EOF'
          import hashlib, re
          html = open('index.html', encoding='utf-8').read()
          for asset in ('assets/app.js', 'assets/style.css'):
              digest = hashlib.sha256(open(asset, 'rb').read()).hexdigest()[:10]
              html = re.sub(rf'{re.escape(asset)}\?v=[0-9a-zA-Z]+', f'{asset}?v={digest}', html)
          open('index.html', 'w', encoding='utf-8').write(html)
          print('asset versions stamped')
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
