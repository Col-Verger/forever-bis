name: Deploy site

# Instant deploy of the current repo content (data.js as committed) to GitHub Pages,
# without re-running any sims. Use it to publish between the weekly full re-sims.

on:
  workflow_dispatch: {}
  # A safety net: every push to master also deploys the committed site, so a
  # missed Pages deployment (or a blocked API from a local machine) cannot leave
  # the live site behind the repository.
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust asset versions
        run: |
          python - <<'EOF'
          import hashlib, re
          html = open('index.html', encoding='utf-8').read()
          for asset in ('assets/app.js', 'assets/style.css'):
              digest = hashlib.sha256(open(asset, 'rb').read()).hexdigest()[:10]
              html = re.sub(rf'{re.escape(asset)}\?v=[0-9a-zA-Z]+', f'{asset}?v={digest}', html)
          open('index.html', 'w', encoding='utf-8').write(html)
          print('asset versions stamped')
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy_pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub sometimes answers the artifact metadata lookup with zero
      # artifacts right after a successful upload. One delayed retry fixes it.
      - name: Wait before retrying the deployment
        if: steps.deploy_pages.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy_pages.outcome == 'failure'
        uses: actions/deploy-pages@v4
