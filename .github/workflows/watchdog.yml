name: Watchdog - refresh stale data

# GitHub's scheduled runs are best effort and can be hours late (the old
# 04:00 UTC run was showing up around 14:00 and getting cancelled). Instead
# of one fragile timer, check every hour whether the last successful resim is
# older than a day and dispatch one only then. A run already in progress, or
# a failure in the last six hours, makes the watchdog stay quiet.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: resim-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run a resim only when the data is stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import datetime, json, os, subprocess, sys, urllib.request

          repo = os.environ['REPO']

          def gh(*args):
              return subprocess.check_output(['gh', *args, '--repo', repo], text=True)

          runs = json.loads(gh('run', 'list', '--workflow', 'resim.yml',
                               '--limit', '20', '--json',
                               'status,conclusion,createdAt'))
          now = datetime.datetime.now(datetime.timezone.utc)

          active = [r for r in runs
                    if r['status'] in ('queued', 'in_progress', 'requested', 'waiting', 'pending')]
          if active:
              print('a resim is already active; skip')
              sys.exit(0)

          def when(r):
              return datetime.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))

          # The freshness that matters is the oldest set on the live site, not
          # the last successful workflow: a one-class rerun must not reset the
          # clock for every other class.
          site = 'https://col-verger.github.io/forever-bis/data.js'
          try:
              req = urllib.request.Request(
                  site + '?x=%d' % int(now.timestamp()),
                  headers={'User-Agent': 'forever-bis-watchdog/1.0',
                           'Cache-Control': 'no-cache'})
              raw = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')
              data = json.loads(raw[raw.find('{'):raw.rfind('}') + 1])
              dates = [datetime.datetime.fromisoformat(v['simmedAt'].replace('Z', '+00:00'))
                       for v in (data.get('loadouts') or {}).values() if v.get('simmedAt')]
              oldest = min(dates) if dates else None
              age = (now - oldest).total_seconds() / 3600 if oldest else 1e9
          except Exception as exc:
              print(f'cannot read the live data ({exc}); skip')
              sys.exit(0)

          last_run = runs[0] if runs else {}
          # Aim for a morning refresh: inside 00:00-06:00 UTC twelve hours is
          # enough; outside it, wait for a full day before the fallback run.
          limit = 12 if 0 <= now.hour < 6 else 23
          print(f'oldest set: {oldest} ({age:.1f}h ago); last run: {last_run.get("conclusion")}; limit: {limit}h')

          if age < limit:
              print('data is fresh enough; skip')
              sys.exit(0)

          recent_fail = [r for r in runs
                         if r['conclusion'] == 'failure'
                         and (now - when(r)).total_seconds() < 6 * 3600]
          if recent_fail:
              print('a recent attempt failed; retry in a few hours')
              sys.exit(0)

          print('dispatching resim.yml')
          subprocess.check_call(['gh', 'workflow', 'run', 'resim.yml',
                                 '--ref', 'master', '--repo', repo])
          EOF
