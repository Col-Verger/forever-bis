name: Re-sim and deploy

# Builds the sim CLI from the latest wowsims/forever master, re-runs every class's
# per-slot searches IN PARALLEL (one matrix job per class and budget; the heavy
# warlock/max set is split into three spec groups so the daily refresh stays short),
# then merges all runs, rebuilds data.js (with the sim's commit hash and date
# stamped into it), commits the runs and deploys the static site to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Source: GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      search_iterations:
        description: 'Iterations per search sim'
        default: '2500'
      final_iterations:
        description: 'Iterations for the final table runs'
        default: '10000'
      only_class:
        description: 'Only this class (empty = all)'
        default: ''
      budget:
        description: 'Only this budget (max or cheap; empty = both)'
        default: ''
      skip_sims:
        description: 'Only rebuild data.js from existing runs (no sims)'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *' # Every day 04:00 UTC; edit to taste.

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: resim
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ONLY_CLASS: ${{ inputs.only_class }}
          BUDGET: ${{ inputs.budget }}
        run: |
          python - <<'EOF'
          import json, os
          classes = ['mage', 'paladin', 'druid', 'hunter', 'priest', 'rogue', 'shaman', 'warlock', 'warrior']
          budgets = ['max', 'cheap']
          only_class = os.environ.get('ONLY_CLASS', '').strip()
          budget = os.environ.get('BUDGET', '').strip()
          if only_class:
              if only_class not in classes:
                  raise SystemExit(f'unknown class: {only_class}')
              classes = [only_class]
          if budget:
              if budget not in budgets:
                  raise SystemExit(f'unknown budget: {budget}')
              budgets = [budget]
          jobs = []
          for c in classes:
              for b in budgets:
                  if c == 'warlock' and b == 'max':
                      # The heaviest set is split by spec: one job per group
                      # finishes in about an hour instead of five.
                      jobs += [
                          {'class': c, 'budget': b, 'part': 'affwrack', 'only': 'warlock-affwrack'},
                          {'class': c, 'budget': b, 'part': 'demo', 'only': 'warlock-demo-shadow,warlock-demo-fire'},
                          {'class': c, 'budget': b, 'part': 'destro', 'only': 'warlock-destro,warlock-smruin'},
                      ]
                  else:
                      jobs.append({'class': c, 'budget': b, 'part': '', 'only': ''})
          print('matrix=' + json.dumps({'include': jobs}))
          EOF

  resim:
    needs: plan
    if: ${{ !inputs.skip_sims }}
    name: resim (${{ matrix.class }}, ${{ matrix.budget }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Clone the simulator
        run: git clone --depth 1 https://github.com/wowsims/forever forever

      - name: Generate the proto packages
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          cd forever
          protoc -I=./proto \
            --go_opt=Mgoogle/protobuf/descriptor.proto=google.golang.org/protobuf/types/descriptorpb \
            --go_out=./sim/core ./proto/*.proto

      - name: Build wowsimcli (with the embedded item database)
        working-directory: forever
        env:
          PATH: ${{ env.PATH }}:${{ env.HOME }}/go/bin
        run: go build --tags=with_db -o ../wowsimcli ./cmd/wowsimcli

      - name: Build the share-link tool (the site's "open this set in WoWSims")
        working-directory: tools/linkhash
        run: go build -o ../../linkhash .

      - name: Build the stats tool (the sim's own ComputeStats)
        working-directory: tools/statdump
        run: go build --tags=with_db -o ../../statdump .

      - name: Check healer readiness (informational)
        run: python tools/check_healers.py --forever forever

      - name: Materialize candidate pools
        run: python tools/make_pools.py --forever forever --configs configs

      # Every artifact must hold only this class's runs: the publish merges all nine
      # into one folder, and a full copy in each artifact would let a stale class
      # overwrite a freshly simulated one.
      - name: Start from an empty runs folder
        run: rm -rf runs && mkdir runs

      - name: Run the per-slot searches (${{ matrix.class }})
        run: >
          python tools/run_sims.py --forever forever --wowsimcli wowsimcli
          --configs configs --out runs --verbose --jobs 3
          --class ${{ matrix.class }}
          --linkhash ./linkhash
          --statdump ./statdump
          --search-iterations ${{ inputs.search_iterations || '2500' }}
          --final-iterations ${{ inputs.final_iterations || '10000' }}
          --budgets ${{ matrix.budget }}
          ${{ matrix.only && format('--only {0}', matrix.only) || '' }}

      - name: Upload the runs
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.class }}-${{ matrix.budget }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: runs/
          retention-days: 5

  publish:
    needs: [plan, resim]
    # Publish whatever refreshed. A class that timed out or broke keeps its previous
    # runs (every set carries its own sim date), so a partial refresh updates the site
    # instead of freezing it; a cancelled run deploys nothing.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync with the latest commit
        run: |
          git config user.name "resim-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin ${{ github.ref_name }}

      - name: Collect the runs from every class
        if: ${{ !inputs.skip_sims }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: runs/
          pattern: runs-*
          merge-multiple: true

      - name: Fetch the sim, its commit hash and its item database
        run: |
          # Outside the site checkout: a clone inside it would dirty the work tree
          # and make the commit/push steps fail.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/wowsims/forever "$RUNNER_TEMP/forever"
          cd "$RUNNER_TEMP/forever"
          git sparse-checkout set assets/database
          echo "SIM_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          ls assets/database/db.json

      - name: Rebuild data.js
        run: >
          python tools/build_data.py --forever "$RUNNER_TEMP/forever" --runs runs --configs configs
          --out data.js --commit "${{ env.SIM_HASH || 'committed' }}" --repo "${{ github.repository }}"

      - name: Build the static per-spec pages (search engines)
        run: python tools/make_pages.py --data data.js --out .

      - name: Cache-bust asset versions
        run: |
          python - <<'EOF'
          import hashlib, re
          html = open('index.html', encoding='utf-8').read()
          for asset in ('assets/app.js', 'assets/style.css'):
              digest = hashlib.sha256(open(asset, 'rb').read()).hexdigest()[:10]
              html = re.sub(rf'{re.escape(asset)}\?v=[0-9a-zA-Z]+', f'{asset}?v={digest}', html)
          open('index.html', 'w', encoding='utf-8').write(html)
          print('asset versions stamped')
          EOF

      - name: Commit the runs and the data
        run: |
          git add data.js index.html runs configs/pools tools/icons.json tools/ru_names.json tools/ru_geo.json
          git add spec sitemap.xml
          git commit -m "Re-sim: ${{ env.SIM_HASH || 'manual' }} $(date -u +%F)" || echo "nothing changed"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy_pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub sometimes answers the artifact metadata lookup with zero
      # artifacts right after a successful upload. One delayed retry fixes it.
      - name: Wait before retrying the deployment
        if: steps.deploy_pages.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy_pages.outcome == 'failure'
        uses: actions/deploy-pages@v4

  report:
    # Without anyone watching, a failed run still leaves a trace: one open issue
    # that collects every failure, instead of a silent red run in the Actions tab.
    needs: [resim, publish]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Прогон $(date -u +%F) завершился с ошибкой. Ссылка: $run"
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search 'Прогон не удался in:title' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "Прогон не удался" --body "$body"
          fi
